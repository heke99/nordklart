name: Build and Push Docker Image

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  # Must be the repository's own owner. GITHUB_TOKEN's packages:write scope is
  # bound to that owner, so a hardcoded foreign namespace cannot be pushed to —
  # this was pinned at `nordklart/nordklart`, a GitHub owner that does not
  # exist, and every push failed with `denied: not_found: owner not found`
  # after a full 26-minute two-architecture build. Nothing caught it because
  # the workflow never got that far: the trivy-action pin was invalid, so every
  # run died during *Prepare all required actions*, before checkout.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # OIDC token used by cosign keyless signing.
      id-token: write
      # SARIF upload to the repo's "Security" tab from the Trivy scan.
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # On main: push `latest` + commit-sha tags.
          # On v*.*.* tags: push semver tags (1.2.3, 1.2, 1) for production pinning.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            EXTENSIONS_PRESET=hosted
          # SBOM (software bill of materials) + SLSA provenance are attached as
          # OCI attestations, queryable via `docker buildx imagetools inspect`.
          provenance: mode=max
          sbom: true
          # Per-branch cache scope so a PR branch can't poison main's cache
          # layers. Fall back to main's cache on first build of a new branch.
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=main
          cache-to: type=gha,scope=${{ github.ref_name }},mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign the image (keyless OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      # The scan is deliberately TWO steps. A single step with
      # `format: sarif` cannot also be the gate: the action overrides the
      # severity filter when it builds a SARIF report — it says so itself in
      # the run log, "Building SARIF report with all severities" — so
      # `severity: CRITICAL,HIGH` was silently ignored and `exit-code: '1'`
      # then tripped on any fixable finding of ANY severity, a LOW included.
      # The first run to get this far failed exactly that way, with the gate's
      # own comment claiming HIGH was what blocked. Splitting the steps makes
      # the gate assert what it says and keeps the Security tab complete.
      - name: Scan image with Trivy (gate)
        id: trivy
        # v-prefixed. `aquasecurity/trivy-action@0.30.0` does not exist — the
        # action tags every release as `vX.Y.Z` and only `0.35.0` was ever
        # published unprefixed. The workflow therefore failed at "Prepare all
        # required actions", before checkout, on every run since it was added:
        # the image was never built, signed or scanned. Verified against
        # v0.36.0 that all inputs below are still declared.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          # HIGH is blocking for an accounting application — Trivy's CRITICAL
          # bucket is narrow (mostly RCE-class), and HIGH covers everything
          # from auth bypass to crypto downgrades. ignore-unfixed keeps the
          # gate actionable: only CVEs we can patch by rebuilding fail the
          # pipeline, not upstream-pending issues we have no remediation for.
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          # `table` rather than `sarif` so the severity filter is honoured AND
          # the findings are legible in the run log. A failing gate that prints
          # nothing is what made the previous failure impossible to diagnose
          # without downloading the SARIF.
          format: table

      # Runs regardless of the gate, and never fails the build itself — its job
      # is to populate the Security tab, not to decide anything. No severity
      # filter, so MEDIUM and LOW stay visible there.
      - name: Build Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        # if:always() so a CRITICAL finding still ends up in the Security tab
        # even though the gate above failed the workflow.
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy
