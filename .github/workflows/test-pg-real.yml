name: pg-real tests

# Runs on pull_request AND on push to main, so the exact SHA that deploys has
# had every migration applied to a real PostgreSQL and the pg-real suite run
# against it. See docs/audits H-01.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pg-real-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-gate:
    # Diff-based gate: only meaningful against a PR base branch. On push to
    # main there is no base_ref, so this job is skipped while pg-real below
    # still runs the full migration + test chain.
    if: github.event_name == 'pull_request'
    # Enforces the database.md rule: a migration touching a trigger/RPC/RLS/
    # DEFERRABLE must come with a *.pg.test.ts change. Previously instruction-
    # only. Escape hatch: `-- pg-test: covered-by <path>` / `-- pg-test: skip
    # (<reason>)` comments inside the migration.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the merge-base with the PR base branch exists.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Require pg-real coverage for trigger/RPC/RLS migrations
        env:
          PG_GATE_BASE: origin/${{ github.base_ref }}
        run: node scripts/check-pg-test-coverage.mjs

  pg-real:
    runs-on: ubuntu-latest

    # Postgres is started as an ordinary docker container rather than a
    # `services:` entry. Functionally identical, with one difference that
    # matters: the runner dumps a service container's entire log at teardown,
    # and this suite deliberately provokes constraint/RLS/trigger errors, each
    # of which Postgres logs with its full failing statement. That dump ran to
    # ~500 KB and pushed the actual vitest output past the end of what the
    # Actions log API will hand back — a failing run was undiagnosable. Setting
    # the server's log level instead is not an option: `postgres` is not a
    # superuser in this image, so ALTER SYSTEM is denied.

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        # Supabase image ships the auth schema, auth.uid(), and the extensions
        # (uuid-ossp, pg_cron, btree_gist, vector) this repo's migrations need.
        # Plain postgres:15 would require manual bootstrap SQL.
        run: |
          set -euo pipefail
          docker run -d --name nordklart-pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            supabase/postgres:15.8.1.060
          # Probe over TCP: during initdb the server listens on the unix socket
          # only, so a TCP probe is what distinguishes "initialising" from
          # "ready for us".
          for _ in $(seq 1 60); do
            if docker exec nordklart-pg pg_isready -h localhost -U postgres >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready in time" >&2
          docker logs --tail 100 nordklart-pg >&2
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Bootstrap storage schema
        # The supabase/postgres image ships a partial storage schema; the rest
        # is provisioned by the storage-api service at runtime, which we do
        # not run in CI. This aligns the schema with what migrations expect.
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f tests/pg/bootstrap.sql

      - name: Apply migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migration files found"
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "Applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Run pg-real suite
        run: |
          set -o pipefail
          npm run test:pg 2>&1 | tee /tmp/pg-real.log

      - name: Failure summary
        # Compact, greppable restatement of what failed, emitted last so it
        # survives log truncation.
        if: failure()
        run: |
          echo '===== pg-real failure summary ====='
          grep -aE '^ *(FAIL|❯|×|AssertionError|Error:)|Test Files|Tests  ' /tmp/pg-real.log | head -300 || true
